name: Lint and Static Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint Python
        run: ruff check api tests 'trigger action/trigger_action.py'

      - name: Check Python formatting
        run: ruff format --check api tests 'trigger action/trigger_action.py'

      - name: Scan Python security
        run: bandit -q -r api 'trigger action/trigger_action.py'

      - name: Audit workflow security
        run: zizmor .github/workflows

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Validate JavaScript syntax
        run: |
          node --input-type=module --check < app.js
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find i18n -type f -name '*.js' -print0)

      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs
